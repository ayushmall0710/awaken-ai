[project]
name = "awaken-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mne>=1.6",
    "mne-icalabel>=0.7",
    "onnxruntime>=1.16",
    "tqdm>=4.66",
    "mutagen>=1.47.0",
    "pyarrow>=14.0",
    "librosa>=0.10",
    "statsmodels>=0.14",
    "typer>=0.12",
    "rich>=13.0",
    "scikit-learn>=1.3",
]

[project.scripts]
awakenai = "src.cli.main:app"

[project.optional-dependencies]
# Development dependencies (includes heavy packages like Whisper)
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "openai-whisper>=20231117",
]
# Testing dependencies
test = [
    "pytest>=7.4",
]
# Linting and formatting
lint = [
    "ruff>=0.1.0"
]
# All dependencies for complete local development
all = [
    "awaken-ai[dev,test,lint]"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
exclude = ["eda", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
