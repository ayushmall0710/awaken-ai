name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: Lint and Format with Ruff
        run: |
          # Run ruff check (linting)
          ruff check .
          # Run ruff format --check (formatting check)
          ruff format --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core dependencies + test deps (skips dev deps like whisper)
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest tests/
